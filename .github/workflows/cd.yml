name: CD

# Se ejecuta cuando CI termina bien en main, o a mano / desde retrain.yml.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USERNAME: ${{ secrets.HF_USERNAME }}
      HF_SPACE: ${{ secrets.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 1

      - name: Verificar secrets
        run: |
          for v in HF_TOKEN HF_USERNAME HF_SPACE; do
            [ -n "${!v}" ] || { echo "::error::Falta el secret $v"; exit 1; }
          done

      - name: Publicar snapshot ligero en el Space (commit huérfano, sin tests/docs/mlflow)
        run: |
          git config user.name  "cd-bot"
          git config user.email "cd-bot@users.noreply.github.com"
          git checkout --orphan hf-deploy
          for path in .github tests docs mlflow.db mlartifacts; do
            git rm -r -q --cached "$path" 2>/dev/null || true
          done
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push --force "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" hf-deploy:main

      - name: Esperar el redeploy y comprobar /health
        run: |
          HOST="$(echo "${HF_USERNAME}-${HF_SPACE}" | tr '[:upper:]_' '[:lower:]-')"
          URL="https://${HOST}.hf.space"
          echo "Comprobando $URL"
          for i in $(seq 1 60); do
            if curl -fs "$URL/health" | grep -q '"status":"ok"'; then
              echo "✅ Space en línea"; curl -s "$URL/model-info"; exit 0
            fi
            sleep 10
          done
          echo "::error::El Space no respondió en 10 minutos"; exit 1
